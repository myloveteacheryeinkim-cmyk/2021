<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퓨전 - AI 캐릭터 채팅</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface2: #1e1e1e;
            --border: #2a2a2a;
            --text: #f0f0f0;
            --text2: #888;
            --accent: #7c3aed;
            --accent2: #a855f7;
            --success: #10b981;
            --error: #ef4444;
            --warn: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
        button { font-family: inherit; cursor: pointer; }
        input, textarea, select { font-family: inherit; }

        /* 레이아웃 */
        .app { display: flex; height: 100vh; }

        /* 사이드바 */
        .sidebar {
            width: 300px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .settings-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.1rem;
        }
        .settings-btn:hover { background: var(--border); }

        /* 탭 */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text2);
            font-size: 0.85rem;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* 캐릭터 리스트 */
        .char-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .char-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--surface2);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .char-card:hover { border-color: var(--border); }
        .char-card.active { border-color: var(--accent); background: rgba(124, 58, 237, 0.1); }
        .char-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .char-info { flex: 1; min-width: 0; }
        .char-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .char-desc { font-size: 0.8rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .char-meta { display: flex; gap: 8px; margin-top: 4px; font-size: 0.7rem; color: var(--text2); }
        .char-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .char-action-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text2);
            font-size: 0.8rem;
        }
        .char-action-btn:hover { background: var(--border); color: var(--text); }

        .add-char-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            margin-top: 8px;
        }
        .add-char-btn:hover { opacity: 0.9; }

        /* 메인 채팅 영역 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* 채팅 헤더 */
        .chat-header {
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-char-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .chat-name { font-weight: 600; }
        .chat-status { font-size: 0.75rem; color: var(--success); }
        .chat-actions { display: flex; gap: 8px; }
        .action-btn {
            padding: 8px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn:hover { background: var(--border); }

        /* 메시지 영역 */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .msg {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            max-width: 80%;
        }
        .msg.user {
            flex-direction: row-reverse;
            margin-left: auto;
        }
        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1rem;
        }
        .msg-content { max-width: 100%; }
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .msg-bubble {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 16px 16px 4px 16px;
        }
        .msg.assistant .msg-bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px 16px 16px 4px;
        }
        .msg-time {
            font-size: 0.7rem;
            color: var(--text2);
            margin-top: 4px;
        }
        .msg.user .msg-time { text-align: right; }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text2);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); }
            40% { transform: scale(1); }
        }

        /* 입력 영역 */
        .input-area {
            padding: 16px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
        .input-wrapper {
            display: flex;
            gap: 12px;
        }
        .input-box {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 12px;
        }
        .input-box:focus-within { border-color: var(--accent); }
        .input-box textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            outline: none;
        }
        .input-box textarea::placeholder { color: var(--text2); }
        .send-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .send-btn:hover { opacity: 0.9; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text2);
        }

        /* 우측 패널 */
        .right-panel {
            width: 320px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .panel-section {
            margin-bottom: 20px;
        }
        .panel-label {
            font-size: 0.8rem;
            color: var(--text2);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .panel-textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            resize: vertical;
        }
        .panel-textarea:focus { outline: none; border-color: var(--accent); }
        .panel-count {
            text-align: right;
            font-size: 0.7rem;
            color: var(--text2);
            margin-top: 4px;
        }

        .model-select {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
        }
        .model-select:focus { outline: none; border-color: var(--accent); }

        .api-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
        }
        .api-input:focus { outline: none; border-color: var(--accent); }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            margin-top: 12px;
        }
        .save-btn:hover { opacity: 0.9; }

        /* 모달 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal h3 { font-size: 1.2rem; }
        .modal-close {
            background: none;
            border: none;
            color: var(--text2);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text2);
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .form-textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            resize: vertical;
        }
        .form-textarea:focus { outline: none; border-color: var(--accent); }
        .primary-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .primary-btn:hover { opacity: 0.9; }

        /* 아바타 선택 */
        .avatar-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .avatar-option {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        .avatar-option:hover { transform: scale(1.1); }
        .avatar-option.selected { border-color: var(--accent); }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        /* 빈 상태 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text2);
            text-align: center;
            padding: 40px;
        }
        .empty-state-icon { font-size: 4rem; margin-bottom: 16px; }
        .empty-state h2 { margin-bottom: 8px; color: var(--text); }

        /* 반응형 */
        @media (max-width: 1200px) {
            .right-panel { display: none; }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">✦ 퓨전</div>
                <button class="settings-btn" onclick="openSettings()">⚙️</button>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="chars">캐릭터</button>
                <button class="tab" data-tab="chats">대화</button>
            </div>

            <div class="char-list" id="charList"></div>

            <div style="padding: 12px;">
                <button class="add-char-btn" onclick="openCharEditor()">+ 새 캐릭터 만들기</button>
            </div>
        </aside>

        <!-- 메인 채팅 영역 -->
        <main class="main">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="chat-char-info">
                    <div class="chat-avatar" id="chatAvatar"></div>
                    <div>
                        <div class="chat-name" id="chatName"></div>
                        <div class="chat-status">● 온라인</div>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="action-btn" onclick="toggleRightPanel()">📝 노트</button>
                    <button class="action-btn" onclick="regenerateLastMsg()">🔄 재생성</button>
                    <button class="action-btn" onclick="clearChat()">🗑️ 초기화</button>
                </div>
            </div>

            <div class="messages" id="messages">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">💬</div>
                    <h2>퓨전에 오신 것을 환영합니다</h2>
                    <p>왼쪽에서 캐릭터를 선택하거나 새로 만들어 대화를 시작하세요</p>
                </div>
            </div>

            <div class="input-area" id="inputArea" style="display: none;">
                <div class="input-wrapper">
                    <div class="input-box">
                        <textarea id="msgInput" rows="1" placeholder="메시지를 입력하세요..." onkeydown="handleKeyDown(event)"></textarea>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
                <div class="input-info">
                    <span id="modelInfo">모델: -</span>
                    <span id="tokenInfo">토큰: 0</span>
                </div>
            </div>
        </main>

        <!-- 우측 패널 -->
        <aside class="right-panel" id="rightPanel">
            <div class="panel-header">캐릭터 설정</div>
            <div class="panel-content">
                <div class="panel-section">
                    <div class="panel-label">AI 모델</div>
                    <select class="model-select" id="modelSelect" onchange="saveSettings()">
                        <optgroup label="OpenAI">
                            <option value="openai:gpt-4o">GPT-4o</option>
                            <option value="openai:gpt-4o-mini" selected>GPT-4o Mini</option>
                            <option value="openai:gpt-4-turbo">GPT-4 Turbo</option>
                        </optgroup>
                        <optgroup label="Anthropic">
                            <option value="claude:claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                            <option value="claude:claude-3-opus-20240229">Claude 3 Opus</option>
                            <option value="claude:claude-3-haiku-20240307">Claude 3 Haiku</option>
                        </optgroup>
                        <optgroup label="Google">
                            <option value="gemini:gemini-1.5-pro">Gemini 1.5 Pro</option>
                            <option value="gemini:gemini-1.5-flash">Gemini 1.5 Flash</option>
                        </optgroup>
                    </select>
                </div>

                <div class="panel-section">
                    <div class="panel-label">유저 노트 (캐릭터에게 전달)</div>
                    <textarea class="panel-textarea" id="userNote" placeholder="이름, 외모, 성격, 관계 설정 등 캐릭터에게 알려줄 정보..." oninput="updateNoteCount()"></textarea>
                    <div class="panel-count"><span id="noteCount">0</span> / 1500</div>
                </div>

                <div class="panel-section">
                    <div class="panel-label">대화 기록</div>
                    <div style="font-size: 0.85rem; color: var(--text2);">
                        메시지: <span id="msgCount">0</span>개
                    </div>
                </div>

                <button class="save-btn" onclick="saveUserNote()">노트 저장</button>
            </div>
        </aside>
    </div>

    <!-- 캐릭터 생성/편집 모달 -->
    <div class="modal-overlay" id="charModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="charModalTitle">새 캐릭터 만들기</h3>
                <button class="modal-close" onclick="closeModal('charModal')">×</button>
            </div>

            <div class="form-group">
                <div class="panel-label">아바타</div>
                <div class="avatar-picker" id="avatarPicker"></div>
            </div>

            <div class="form-group">
                <label class="form-label">이름 *</label>
                <input type="text" class="form-input" id="charNameInput" placeholder="캐릭터 이름">
            </div>

            <div class="form-group">
                <label class="form-label">한 줄 소개</label>
                <input type="text" class="form-input" id="charDescInput" placeholder="캐릭터를 설명하는 짧은 문장">
            </div>

            <div class="form-group">
                <label class="form-label">첫 인사 메시지</label>
                <textarea class="form-textarea" id="charGreetInput" style="min-height: 80px;" placeholder="대화 시작 시 캐릭터가 먼저 보낼 메시지"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">캐릭터 설정 (시스템 프롬프트)</label>
                <textarea class="form-textarea" id="charPromptInput" placeholder="캐릭터의 성격, 말투, 배경 스토리, 행동 지침 등을 자세히 작성하세요..."></textarea>
                <div class="panel-count"><span id="promptCount">0</span> / 10000</div>
            </div>

            <button class="primary-btn" onclick="saveCharacter()">저장</button>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>API 설정</h3>
                <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
            </div>

            <div class="form-group">
                <label class="form-label">OpenAI API Key</label>
                <input type="password" class="form-input" id="openaiKeyInput" placeholder="sk-...">
            </div>

            <div class="form-group">
                <label class="form-label">Claude API Key</label>
                <input type="password" class="form-input" id="claudeKeyInput" placeholder="sk-ant-...">
            </div>

            <div class="form-group">
                <label class="form-label">Gemini API Key</label>
                <input type="password" class="form-input" id="geminiKeyInput" placeholder="AI...">
            </div>

            <p style="font-size: 0.8rem; color: var(--text2); margin-bottom: 16px;">
                API 키는 브라우저에 안전하게 저장되며 서버로 전송될 때만 사용됩니다.
            </p>

            <button class="primary-btn" onclick="saveApiKeys()">저장</button>
        </div>
    </div>

<script>
// ==================== 상태 관리 ====================
let state = {
    characters: [],
    currentCharId: null,
    conversations: {},
    settings: {
        model: 'openai:gpt-4o-mini',
        openaiKey: '',
        claudeKey: '',
        geminiKey: ''
    },
    userNotes: {}
};

const AVATARS = ['😊', '😎', '🥰', '😈', '🤖', '👻', '🦊', '🐱', '🐰', '🌸', '🌙', '⭐', '🔥', '💜', '🎭', '👑', '🗡️', '🎮'];
const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6', '#ec4899'];

// ==================== 초기화 ====================
document.addEventListener('DOMContentLoaded', () => {
    loadState();
    renderCharacterList();
    setupTextareaAutoResize();
    renderAvatarPicker();

    // 탭 이벤트
    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
        };
    });

    // 프롬프트 글자수 카운터
    document.getElementById('charPromptInput').oninput = function() {
        document.getElementById('promptCount').textContent = this.value.length;
    };
});

function loadState() {
    const saved = localStorage.getItem('fusion_state');
    if (saved) {
        const parsed = JSON.parse(saved);
        state = { ...state, ...parsed };
    }

    // 기본 캐릭터가 없으면 샘플 추가
    if (state.characters.length === 0) {
        state.characters = [
            {
                id: 'sample1',
                name: '루나',
                desc: '밝고 활발한 마법학교 학생',
                avatar: '🌸',
                color: '#ec4899',
                greeting: '안녕! 나는 마법학교에 다니는 루나야! ✨ 오늘 학교에서 재미있는 일이 있었는데 들을래?',
                prompt: `당신은 루나입니다. 밝고 활발한 16세 마법학교 학생이에요.

성격:
- 항상 긍정적이고 밝은 에너지를 가지고 있어요
- 호기심이 많고 새로운 것을 배우는 걸 좋아해요
- 친구들을 소중히 여기고 잘 챙겨요
- 가끔 덜렁거리고 실수를 하기도 해요

말투:
- 반말을 사용해요
- "~야", "~지?", "~거든!" 같은 친근한 어미를 써요
- 이모티콘과 감탄사를 자주 사용해요
- 마법 관련 용어를 자연스럽게 섞어 말해요

배경:
- 왕립 마법학교 2학년
- 원소 마법 중 불 속성에 재능이 있어요
- 학교 마법 동아리 부장이에요`
            },
            {
                id: 'sample2',
                name: '제로',
                desc: '냉정한 뱀파이어 귀족',
                avatar: '🌙',
                color: '#8b5cf6',
                greeting: '...또 왔군. 뭐, 들어와도 좋아. 어차피 이 긴 밤을 혼자 보내는 것도 지겨웠으니까.',
                prompt: `당신은 제로입니다. 수백 년을 살아온 뱀파이어 귀족이에요.

성격:
- 겉으로는 냉정하고 무심해 보이지만 속은 따뜻해요
- 말수가 적고 필요한 말만 해요
- 인간에 대한 호기심이 있지만 티를 안 내요
- 고독을 즐기는 척하지만 사실 외로움을 타요

말투:
- 반말과 존댓말을 상황에 따라 섞어 써요
- "......" 같은 침묵을 자주 사용해요
- 짧고 간결하게 말해요
- 가끔 옛날 말투가 섞여 나와요

배경:
- 300년 전 귀족 가문 출신
- 고성에서 혼자 살고 있어요
- 피아노를 잘 치고 클래식 음악을 좋아해요`
            }
        ];
        saveState();
    }

    // 설정 복원
    document.getElementById('modelSelect').value = state.settings.model;
}

function saveState() {
    localStorage.setItem('fusion_state', JSON.stringify(state));
}

// ==================== 캐릭터 관리 ====================
function renderCharacterList() {
    const list = document.getElementById('charList');
    list.innerHTML = '';

    state.characters.forEach(char => {
        const div = document.createElement('div');
        div.className = 'char-card' + (char.id === state.currentCharId ? ' active' : '');
        div.onclick = () => selectCharacter(char.id);
        div.innerHTML = `
            <div class="char-avatar" style="background: ${char.color}">${char.avatar}</div>
            <div class="char-info">
                <div class="char-name">${escapeHtml(char.name)}</div>
                <div class="char-desc">${escapeHtml(char.desc || '')}</div>
                <div class="char-meta">
                    <span>💬 ${(state.conversations[char.id] || []).length}</span>
                </div>
            </div>
            <div class="char-actions">
                <button class="char-action-btn" onclick="event.stopPropagation(); editCharacter('${char.id}')">✏️</button>
                <button class="char-action-btn" onclick="event.stopPropagation(); deleteCharacter('${char.id}')">🗑️</button>
            </div>
        `;
        list.appendChild(div);
    });
}

function selectCharacter(charId) {
    const char = state.characters.find(c => c.id === charId);
    if (!char) return;

    state.currentCharId = charId;
    saveState();

    // UI 업데이트
    renderCharacterList();
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('inputArea').style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';

    document.getElementById('chatAvatar').textContent = char.avatar;
    document.getElementById('chatAvatar').style.background = char.color;
    document.getElementById('chatName').textContent = char.name;

    // 유저 노트 복원
    document.getElementById('userNote').value = state.userNotes[charId] || '';
    updateNoteCount();

    // 대화 렌더링
    renderMessages();
    updateModelInfo();
}

function renderAvatarPicker() {
    const picker = document.getElementById('avatarPicker');
    picker.innerHTML = '';
    AVATARS.forEach((emoji, i) => {
        const div = document.createElement('div');
        div.className = 'avatar-option';
        div.style.background = COLORS[i % COLORS.length];
        div.textContent = emoji;
        div.dataset.avatar = emoji;
        div.dataset.color = COLORS[i % COLORS.length];
        div.onclick = () => {
            document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
            div.classList.add('selected');
        };
        picker.appendChild(div);
    });
}

let editingCharId = null;

function openCharEditor(charId = null) {
    editingCharId = charId;
    const modal = document.getElementById('charModal');

    if (charId) {
        const char = state.characters.find(c => c.id === charId);
        document.getElementById('charModalTitle').textContent = '캐릭터 수정';
        document.getElementById('charNameInput').value = char.name;
        document.getElementById('charDescInput').value = char.desc || '';
        document.getElementById('charGreetInput').value = char.greeting || '';
        document.getElementById('charPromptInput').value = char.prompt || '';
        document.getElementById('promptCount').textContent = (char.prompt || '').length;

        // 아바타 선택
        document.querySelectorAll('.avatar-option').forEach(a => {
            a.classList.toggle('selected', a.dataset.avatar === char.avatar);
        });
    } else {
        document.getElementById('charModalTitle').textContent = '새 캐릭터 만들기';
        document.getElementById('charNameInput').value = '';
        document.getElementById('charDescInput').value = '';
        document.getElementById('charGreetInput').value = '';
        document.getElementById('charPromptInput').value = '';
        document.getElementById('promptCount').textContent = '0';
        document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
        document.querySelector('.avatar-option').classList.add('selected');
    }

    modal.classList.add('show');
}

function editCharacter(charId) {
    openCharEditor(charId);
}

function saveCharacter() {
    const name = document.getElementById('charNameInput').value.trim();
    if (!name) {
        toast('이름을 입력해주세요', 'error');
        return;
    }

    const selectedAvatar = document.querySelector('.avatar-option.selected');
    const avatar = selectedAvatar ? selectedAvatar.dataset.avatar : '😊';
    const color = selectedAvatar ? selectedAvatar.dataset.color : '#8b5cf6';

    const charData = {
        id: editingCharId || 'char_' + Date.now(),
        name,
        desc: document.getElementById('charDescInput').value.trim(),
        avatar,
        color,
        greeting: document.getElementById('charGreetInput').value.trim(),
        prompt: document.getElementById('charPromptInput').value.trim()
    };

    if (editingCharId) {
        const idx = state.characters.findIndex(c => c.id === editingCharId);
        if (idx !== -1) state.characters[idx] = charData;
    } else {
        state.characters.push(charData);
    }

    saveState();
    renderCharacterList();
    closeModal('charModal');
    toast(editingCharId ? '캐릭터가 수정되었습니다' : '캐릭터가 생성되었습니다', 'success');

    if (!editingCharId) {
        selectCharacter(charData.id);
    }
}

function deleteCharacter(charId) {
    if (!confirm('정말 삭제하시겠습니까?')) return;

    state.characters = state.characters.filter(c => c.id !== charId);
    delete state.conversations[charId];
    delete state.userNotes[charId];

    if (state.currentCharId === charId) {
        state.currentCharId = null;
        document.getElementById('chatHeader').style.display = 'none';
        document.getElementById('inputArea').style.display = 'none';
        document.getElementById('emptyState').style.display = 'flex';
        document.getElementById('messages').innerHTML = '<div class="empty-state" id="emptyState"><div class="empty-state-icon">💬</div><h2>퓨전에 오신 것을 환영합니다</h2><p>왼쪽에서 캐릭터를 선택하거나 새로 만들어 대화를 시작하세요</p></div>';
    }

    saveState();
    renderCharacterList();
    toast('캐릭터가 삭제되었습니다', 'success');
}

// ==================== 메시지 관리 ====================
function renderMessages() {
    const container = document.getElementById('messages');
    const msgs = state.conversations[state.currentCharId] || [];
    const char = state.characters.find(c => c.id === state.currentCharId);

    if (msgs.length === 0 && char?.greeting) {
        // 첫 인사 메시지 표시
        container.innerHTML = '';
        addMessageToUI('assistant', char.greeting, char);
        return;
    }

    container.innerHTML = '';
    msgs.forEach(msg => {
        addMessageToUI(msg.role, msg.content, char);
    });

    document.getElementById('msgCount').textContent = msgs.length;
    container.scrollTop = container.scrollHeight;
}

function addMessageToUI(role, content, char) {
    const container = document.getElementById('messages');
    const time = new Date().toLocaleTimeString('ko', { hour: '2-digit', minute: '2-digit' });

    const div = document.createElement('div');
    div.className = `msg ${role}`;

    if (role === 'user') {
        div.innerHTML = `
            <div class="msg-avatar" style="background: var(--accent)">👤</div>
            <div class="msg-content">
                <div class="msg-bubble">${escapeHtml(content)}</div>
                <div class="msg-time">${time}</div>
            </div>
        `;
    } else {
        div.innerHTML = `
            <div class="msg-avatar" style="background: ${char?.color || '#8b5cf6'}">${char?.avatar || '🤖'}</div>
            <div class="msg-content">
                <div class="msg-bubble">${escapeHtml(content)}</div>
                <div class="msg-time">${time}</div>
            </div>
        `;
    }

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !state.currentCharId) return;

    const char = state.characters.find(c => c.id === state.currentCharId);
    if (!char) return;

    // 메시지 저장 및 표시
    if (!state.conversations[state.currentCharId]) {
        state.conversations[state.currentCharId] = [];
    }

    // 첫 메시지인 경우 인사 메시지도 기록에 추가
    if (state.conversations[state.currentCharId].length === 0 && char.greeting) {
        state.conversations[state.currentCharId].push({ role: 'assistant', content: char.greeting });
    }

    state.conversations[state.currentCharId].push({ role: 'user', content });
    saveState();

    addMessageToUI('user', content, char);
    input.value = '';
    input.style.height = 'auto';

    // 타이핑 표시
    const typingDiv = document.createElement('div');
    typingDiv.className = 'msg assistant';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `
        <div class="msg-avatar" style="background: ${char.color}">${char.avatar}</div>
        <div class="msg-content">
            <div class="msg-bubble">
                <div class="typing-indicator"><span></span><span></span><span></span></div>
            </div>
        </div>
    `;
    document.getElementById('messages').appendChild(typingDiv);
    document.getElementById('messages').scrollTop = 99999;

    // API 호출
    document.getElementById('sendBtn').disabled = true;

    try {
        const response = await callAI(content, char);
        document.getElementById('typingIndicator')?.remove();

        state.conversations[state.currentCharId].push({ role: 'assistant', content: response });
        saveState();
        addMessageToUI('assistant', response, char);
        document.getElementById('msgCount').textContent = state.conversations[state.currentCharId].length;

    } catch (error) {
        document.getElementById('typingIndicator')?.remove();
        toast(error.message || 'API 오류가 발생했습니다', 'error');
    } finally {
        document.getElementById('sendBtn').disabled = false;
    }
}

async function callAI(userMessage, char) {
    const [provider, model] = state.settings.model.split(':');

    let apiKey;
    if (provider === 'openai') apiKey = state.settings.openaiKey;
    else if (provider === 'claude') apiKey = state.settings.claudeKey;
    else if (provider === 'gemini') apiKey = state.settings.geminiKey;

    if (!apiKey) {
        throw new Error(`${provider.toUpperCase()} API 키를 설정해주세요`);
    }

    // 시스템 프롬프트 구성
    let systemPrompt = char.prompt || `당신은 ${char.name}입니다. ${char.desc || ''}`;

    // 유저 노트 추가
    const userNote = state.userNotes[state.currentCharId];
    if (userNote) {
        systemPrompt += `\n\n[유저 정보]\n${userNote}`;
    }

    // 대화 기록 (최근 20개)
    const history = (state.conversations[state.currentCharId] || []).slice(-20);

    let messages;
    if (provider === 'claude') {
        messages = history.map(m => ({ role: m.role, content: m.content }));
    } else {
        messages = [
            { role: 'system', content: systemPrompt },
            ...history.map(m => ({ role: m.role, content: m.content }))
        ];
    }

    const endpoint = `/api/${provider}`;
    const body = {
        apiKey,
        model,
        messages,
        ...(provider === 'claude' && { system: systemPrompt })
    };

    const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'API 오류');

    return data.content;
}

function regenerateLastMsg() {
    const msgs = state.conversations[state.currentCharId];
    if (!msgs || msgs.length < 2) return;

    // 마지막 AI 메시지 삭제
    if (msgs[msgs.length - 1].role === 'assistant') {
        msgs.pop();
    }

    // 마지막 유저 메시지로 재생성
    const lastUserMsg = msgs[msgs.length - 1];
    if (lastUserMsg?.role === 'user') {
        msgs.pop(); // 유저 메시지도 제거 후 다시 전송
        document.getElementById('msgInput').value = lastUserMsg.content;
        saveState();
        renderMessages();
        sendMessage();
    }
}

function clearChat() {
    if (!confirm('대화 기록을 모두 삭제하시겠습니까?')) return;
    state.conversations[state.currentCharId] = [];
    saveState();
    renderMessages();
    toast('대화가 초기화되었습니다', 'success');
}

// ==================== 설정 ====================
function openSettings() {
    document.getElementById('openaiKeyInput').value = state.settings.openaiKey || '';
    document.getElementById('claudeKeyInput').value = state.settings.claudeKey || '';
    document.getElementById('geminiKeyInput').value = state.settings.geminiKey || '';
    document.getElementById('settingsModal').classList.add('show');
}

function saveApiKeys() {
    state.settings.openaiKey = document.getElementById('openaiKeyInput').value.trim();
    state.settings.claudeKey = document.getElementById('claudeKeyInput').value.trim();
    state.settings.geminiKey = document.getElementById('geminiKeyInput').value.trim();
    saveState();
    closeModal('settingsModal');
    toast('API 키가 저장되었습니다', 'success');
}

function saveSettings() {
    state.settings.model = document.getElementById('modelSelect').value;
    saveState();
    updateModelInfo();
}

function updateModelInfo() {
    const model = document.getElementById('modelSelect').value;
    const [provider, modelName] = model.split(':');
    document.getElementById('modelInfo').textContent = `모델: ${modelName}`;
}

function updateNoteCount() {
    const note = document.getElementById('userNote').value;
    document.getElementById('noteCount').textContent = note.length;
}

function saveUserNote() {
    if (!state.currentCharId) return;
    state.userNotes[state.currentCharId] = document.getElementById('userNote').value;
    saveState();
    toast('노트가 저장되었습니다', 'success');
}

function toggleRightPanel() {
    const panel = document.getElementById('rightPanel');
    panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
}

// ==================== 유틸리티 ====================
function closeModal(id) {
    document.getElementById(id).classList.remove('show');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function toast(msg, type) {
    const div = document.createElement('div');
    div.className = `toast ${type}`;
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}

function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function setupTextareaAutoResize() {
    const textarea = document.getElementById('msgInput');
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
}

// 모달 외부 클릭 닫기
document.querySelectorAll('.modal-overlay').forEach(m => {
    m.onclick = e => { if (e.target === m) m.classList.remove('show'); };
});
</script>
