<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퓨전 - AI 캐릭터 채팅</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #1a1a1a;
            --surface3: #222222;
            --border: #2a2a2a;
            --text: #f5f5f5;
            --text2: #999;
            --text3: #666;
            --primary: #8b5cf6;
            --primary2: #a78bfa;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --gold: #fbbf24;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        button { font-family: inherit; cursor: pointer; border: none; }
        input, textarea, select { font-family: inherit; }

        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 100;
        }
        .logo {
            font-size: 1.5rem; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            cursor: pointer;
        }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .cash-display {
            display: flex; align-items: center; gap: 8px;
            background: var(--surface2); padding: 8px 16px;
            border-radius: 20px; font-weight: 600; color: var(--gold); cursor: pointer;
        }
        .header-btn {
            padding: 8px 16px; background: var(--primary); color: white;
            border-radius: 8px; font-weight: 500;
        }
        .header-btn.secondary { background: var(--surface2); color: var(--text); }
        .user-avatar {
            width: 36px; height: 36px; background: var(--primary);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: 600; cursor: pointer;
        }

        .main { margin-top: 60px; min-height: calc(100vh - 60px); }

        .home { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .section-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; }
        .char-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px; margin-bottom: 32px;
        }
        .char-card {
            background: var(--surface); border-radius: 16px; overflow: hidden;
            cursor: pointer; border: 1px solid var(--border); transition: all 0.2s;
        }
        .char-card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .char-card-header {
            height: 120px; display: flex; align-items: center;
            justify-content: center; font-size: 3.5rem;
        }
        .char-card-body { padding: 16px; }
        .char-card-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 4px; }
        .char-card-desc {
            color: var(--text2); font-size: 0.9rem; margin-bottom: 12px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .char-card-meta { display: flex; gap: 12px; color: var(--text3); font-size: 0.8rem; }
        .char-card-creator { color: var(--primary2); font-size: 0.85rem; }
        .adult-badge {
            background: var(--error); color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 0.7rem; font-weight: 600; margin-left: 6px;
        }

        .chat-page { display: none; height: calc(100vh - 60px); }
        .chat-page.active { display: flex; }
        .chat-sidebar {
            width: 320px; background: var(--surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .chat-char-info { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .chat-char-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin: 0 auto 12px;
        }
        .chat-char-name { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
        .chat-char-desc { color: var(--text2); font-size: 0.9rem; }

        .model-section { padding: 16px; border-bottom: 1px solid var(--border); }
        .model-section-title { font-size: 0.85rem; color: var(--text2); margin-bottom: 8px; }
        .model-select {
            width: 100%; padding: 10px 12px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); font-size: 0.9rem; cursor: pointer;
        }
        .model-cost { margin-top: 8px; display: flex; justify-content: space-between; font-size: 0.85rem; }
        .model-cost-value { color: var(--gold); font-weight: 600; }

        .user-note-section { padding: 16px; flex: 1; overflow-y: auto; }
        .user-note-textarea {
            width: 100%; height: 150px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 12px; color: var(--text); font-size: 0.9rem; resize: none;
        }
        .user-note-count { text-align: right; font-size: 0.8rem; color: var(--text3); margin-top: 4px; }

        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; }
        .message { display: flex; gap: 12px; margin-bottom: 20px; max-width: 85%; }
        .message.user { margin-left: auto; flex-direction: row-reverse; }
        .message-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .message-content {
            background: var(--surface); padding: 12px 16px;
            border-radius: 16px; line-height: 1.6;
        }
        .message.user .message-content { background: var(--primary); }
        .message-cost { font-size: 0.75rem; color: var(--text3); margin-top: 4px; text-align: right; }

        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
        .typing-dot {
            width: 8px; height: 8px; background: var(--text3);
            border-radius: 50%; animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .chat-input-area { padding: 16px 24px; background: var(--surface); border-top: 1px solid var(--border); }
        .chat-input-wrapper { display: flex; gap: 12px; align-items: flex-end; }
        .chat-input {
            flex: 1; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 16px; color: var(--text);
            font-size: 1rem; resize: none; max-height: 150px; min-height: 48px;
        }
        .chat-input:focus { outline: none; border-color: var(--primary); }
        .send-btn {
            width: 48px; height: 48px; background: var(--primary);
            border-radius: 12px; color: white; font-size: 1.25rem;
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn:disabled { background: var(--surface3); cursor: not-allowed; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 200; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface); border-radius: 16px;
            width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto;
        }
        .modal-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title { font-size: 1.25rem; font-weight: 600; }
        .modal-close {
            width: 32px; height: 32px; background: var(--surface2);
            border-radius: 8px; color: var(--text); font-size: 1.25rem;
        }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; color: var(--text2); margin-bottom: 8px; }
        .form-input {
            width: 100%; padding: 12px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); font-size: 1rem;
        }
        .form-input:focus { outline: none; border-color: var(--primary); }
        .form-textarea { min-height: 120px; resize: vertical; }
        .form-hint { font-size: 0.8rem; color: var(--text3); margin-top: 4px; }
        .form-btn {
            width: 100%; padding: 14px; background: var(--primary);
            color: white; border-radius: 8px; font-size: 1rem; font-weight: 600; margin-top: 8px;
        }
        .form-btn.secondary { background: var(--surface2); color: var(--text); }
        .form-divider {
            text-align: center; color: var(--text3); margin: 20px 0; position: relative;
        }
        .form-divider::before, .form-divider::after {
            content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--border);
        }
        .form-divider::before { left: 0; }
        .form-divider::after { right: 0; }
        .form-link { text-align: center; margin-top: 16px; color: var(--text2); }
        .form-link a { color: var(--primary); text-decoration: none; }

        .purchase-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .purchase-item {
            background: var(--surface2); border: 2px solid var(--border);
            border-radius: 12px; padding: 16px; text-align: center; cursor: pointer;
        }
        .purchase-item:hover { border-color: var(--primary); }
        .purchase-item.featured { border-color: var(--gold); background: rgba(251, 191, 36, 0.1); }
        .purchase-amount { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
        .purchase-price { color: var(--text2); font-size: 0.9rem; margin-top: 4px; }
        .purchase-bonus { color: var(--success); font-size: 0.85rem; margin-top: 4px; }

        .checkin-btn {
            background: linear-gradient(135deg, var(--success), #16a34a);
            color: white; padding: 12px 24px; border-radius: 12px;
            font-weight: 600; font-size: 1rem; width: 100%; margin-bottom: 16px;
        }
        .checkin-btn:disabled { background: var(--surface3); cursor: not-allowed; }
        .streak-info { text-align: center; padding: 16px; background: var(--surface2); border-radius: 12px; }
        .streak-count { font-size: 2rem; font-weight: 700; color: var(--primary); }

        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface); border: 1px solid var(--border);
            padding: 16px 24px; border-radius: 12px; opacity: 0;
            transition: all 0.3s; z-index: 300;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }

        .loading { display: flex; align-items: center; justify-content: center; padding: 40px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .chat-sidebar { display: none; }
            .char-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="goHome()">퓨전</div>
        <div class="header-right">
            <div id="guestNav">
                <button class="header-btn secondary" onclick="openModal('loginModal')">로그인</button>
                <button class="header-btn" onclick="openModal('registerModal')">회원가입</button>
            </div>
            <div id="userNav" style="display:none;">
                <div class="cash-display" onclick="openModal('purchaseModal')">
                    <span>C</span><span id="cashAmount">0</span>
                </div>
                <button class="header-btn secondary" onclick="openModal('checkinModal')">출석체크</button>
                <div class="user-avatar" id="userAvatar" onclick="logout()">U</div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="home" id="homePage">
            <div class="section-title">인기 캐릭터</div>
            <div class="char-grid" id="charGrid"><div class="loading"><div class="spinner"></div></div></div>
            <button class="header-btn" onclick="openModal('createCharModal')" style="margin-top:16px;">+ 캐릭터 만들기</button>
        </div>

        <div class="chat-page" id="chatPage">
            <aside class="chat-sidebar">
                <div class="chat-char-info">
                    <div class="chat-char-avatar" id="chatCharAvatar">🌸</div>
                    <div class="chat-char-name" id="chatCharName">캐릭터</div>
                    <div class="chat-char-desc" id="chatCharDesc">설명</div>
                </div>
                <div class="model-section">
                    <div class="model-section-title">AI 모델 선택</div>
                    <select class="model-select" id="modelSelect" onchange="updateModelCost()">
                        <optgroup label="Basic Chat (10C)">
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash (900자)</option>
                            <option value="gpt-5-mini">GPT-5 Mini (750자)</option>
                        </optgroup>
                        <optgroup label="Air Chat (20C)">
                            <option value="gemini-3-flash">Gemini 3 Flash (900자)</option>
                            <option value="claude-haiku-4-5">Claude Haiku 4.5 (600자)</option>
                        </optgroup>
                        <optgroup label="Pro Chat 1.0 (40C)">
                            <option value="claude-sonnet-3-7">Claude Sonnet 3.7 (600자)</option>
                            <option value="claude-sonnet-4">Claude Sonnet 4 (600자)</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro (900자)</option>
                            <option value="gpt-4o">GPT-4o (750자)</option>
                        </optgroup>
                        <optgroup label="Pro Chat 2.0 (50C)">
                            <option value="gemini-3-pro">Gemini 3 Pro (750자)</option>
                            <option value="claude-sonnet-4-5">Claude Sonnet 4.5 (600자)</option>
                            <option value="gpt-5.1">GPT-5.1 (900자)</option>
                            <option value="gpt-5.2">GPT-5.2 (900자)</option>
                        </optgroup>
                        <optgroup label="Ultra Chat (80C)">
                            <option value="claude-opus-4-5">Claude Opus 4.5 (600자)</option>
                        </optgroup>
                    </select>
                    <div class="model-cost">
                        <span>메시지당 비용</span>
                        <span class="model-cost-value" id="modelCost">10C</span>
                    </div>
                </div>
                <div class="user-note-section">
                    <div class="model-section-title">유저 노트 (최대 1,500자)</div>
                    <textarea class="user-note-textarea" id="userNote" placeholder="나의 외모, 직업, 캐릭터와의 관계 등..." maxlength="1500" oninput="updateNoteCount()"></textarea>
                    <div class="user-note-count"><span id="noteCount">0</span>/1,500</div>
                </div>
                <div style="padding:16px;">
                    <button class="header-btn secondary" style="width:100%;" onclick="goHome()">← 돌아가기</button>
                </div>
            </aside>
            <div class="chat-main">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <div class="chat-input-wrapper">
                        <textarea class="chat-input" id="chatInput" placeholder="메시지를 입력하세요..." rows="1" onkeydown="handleInputKeydown(event)"></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 로그인 모달 -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">로그인</div>
                <button class="modal-close" onclick="closeModal('loginModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">이메일</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="이메일">
                </div>
                <div class="form-group">
                    <label class="form-label">비밀번호</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="비밀번호">
                </div>
                <button class="form-btn" onclick="login()">로그인</button>
                <div class="form-divider">또는</div>
                <button class="form-btn secondary">Google로 로그인</button>
                <div class="form-link">계정이 없나요? <a href="#" onclick="closeModal('loginModal');openModal('registerModal');">회원가입</a></div>
            </div>
        </div>
    </div>

    <!-- 회원가입 모달 -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">회원가입</div>
                <button class="modal-close" onclick="closeModal('registerModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">이메일</label>
                    <input type="email" class="form-input" id="regEmail" placeholder="이메일">
                </div>
                <div class="form-group">
                    <label class="form-label">닉네임</label>
                    <input type="text" class="form-input" id="regNickname" placeholder="닉네임 (중복 불가)">
                </div>
                <div class="form-group">
                    <label class="form-label">비밀번호</label>
                    <input type="password" class="form-input" id="regPassword" placeholder="비밀번호">
                </div>
                <div class="form-group">
                    <label class="form-label">전화번호 (출석체크 활성화)</label>
                    <input type="tel" class="form-input" id="regPhone" placeholder="010-0000-0000">
                </div>
                <button class="form-btn" onclick="register()">가입하기</button>
                <div class="form-link">이미 계정이 있나요? <a href="#" onclick="closeModal('registerModal');openModal('loginModal');">로그인</a></div>
            </div>
        </div>
    </div>

    <!-- 충전 모달 -->
    <div class="modal-overlay" id="purchaseModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">캐시 충전</div>
                <button class="modal-close" onclick="closeModal('purchaseModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="purchase-grid">
                    <div class="purchase-item" onclick="purchase(1000)">
                        <div class="purchase-amount">1,000C</div>
                        <div class="purchase-price">₩1,000</div>
                    </div>
                    <div class="purchase-item" onclick="purchase(5000)">
                        <div class="purchase-amount">5,000C</div>
                        <div class="purchase-price">₩5,000</div>
                    </div>
                    <div class="purchase-item" onclick="purchase(10000)">
                        <div class="purchase-amount">10,000C</div>
                        <div class="purchase-price">₩10,000</div>
                    </div>
                    <div class="purchase-item featured" onclick="purchase(50000)">
                        <div class="purchase-amount">52,500C</div>
                        <div class="purchase-price">₩50,000</div>
                        <div class="purchase-bonus">+2,500C 보너스!</div>
                    </div>
                    <div class="purchase-item featured" onclick="purchase(100000)">
                        <div class="purchase-amount">110,000C</div>
                        <div class="purchase-price">₩100,000</div>
                        <div class="purchase-bonus">+10,000C 보너스!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 출석체크 모달 -->
    <div class="modal-overlay" id="checkinModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">출석체크</div>
                <button class="modal-close" onclick="closeModal('checkinModal')">×</button>
            </div>
            <div class="modal-body">
                <button class="checkin-btn" onclick="checkIn()">출석체크하고 600C 받기</button>
                <div class="streak-info">
                    <div>연속 출석</div>
                    <div class="streak-count" id="streakCount">0일</div>
                    <div class="form-hint">10일 연속 출석 시 1,000C!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 캐릭터 생성 모달 -->
    <div class="modal-overlay" id="createCharModal">
        <div class="modal" style="max-width:600px;">
            <div class="modal-header">
                <div class="modal-title">캐릭터 만들기</div>
                <button class="modal-close" onclick="closeModal('createCharModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">캐릭터 이름 *</label>
                    <input type="text" class="form-input" id="charName" placeholder="캐릭터 이름">
                </div>
                <div class="form-group">
                    <label class="form-label">한 줄 설명</label>
                    <input type="text" class="form-input" id="charDesc" placeholder="한 줄 설명">
                </div>
                <div class="form-group">
                    <label class="form-label">첫 인사말</label>
                    <textarea class="form-input form-textarea" id="charGreeting" placeholder="캐릭터가 처음 하는 인사말"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">캐릭터 프롬프트 * (최대 10,000자)</label>
                    <textarea class="form-input" id="charPrompt" style="min-height:200px;" placeholder="성격, 말투, 배경 등 자세히..." maxlength="10000" oninput="updatePromptCount()"></textarea>
                    <div class="form-hint"><span id="promptCount">0</span>/10,000자</div>
                </div>
                <div class="form-group">
                    <label class="form-label"><input type="checkbox" id="charIsAdult"> 성인 콘텐츠</label>
                </div>
                <button class="form-btn" onclick="createCharacter()">캐릭터 생성</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let state = { user: null, sessionId: null, currentChar: null, messages: [], characters: [] };
        const MODEL_COSTS = {
            'gemini-2.5-flash': 10, 'gpt-5-mini': 10,
            'gemini-3-flash': 20, 'claude-haiku-4-5': 20,
            'claude-sonnet-3-7': 40, 'claude-sonnet-4': 40, 'gemini-2.5-pro': 40, 'gpt-4o': 40,
            'gemini-3-pro': 50, 'claude-sonnet-4-5': 50, 'gpt-5.1': 50, 'gpt-5.2': 50,
            'claude-opus-4-5': 80
        };

        document.addEventListener('DOMContentLoaded', () => { loadSession(); loadCharacters(); });

        function loadSession() {
            const saved = localStorage.getItem('fusion_session');
            if (saved) { state.sessionId = JSON.parse(saved).sessionId; fetchUser(); }
        }

        async function fetchUser() {
            if (!state.sessionId) return;
            try {
                const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${state.sessionId}` } });
                if (res.ok) { state.user = await res.json(); updateUI(); } else { logout(); }
            } catch (e) { console.error(e); }
        }

        async function loadCharacters() {
            try {
                const res = await fetch('/api/characters', { headers: state.sessionId ? { 'Authorization': `Bearer ${state.sessionId}` } : {} });
                state.characters = await res.json();
                renderCharacters();
            } catch (e) { console.error(e); }
        }

        function updateUI() {
            document.getElementById('guestNav').style.display = state.user ? 'none' : 'flex';
            document.getElementById('userNav').style.display = state.user ? 'flex' : 'none';
            if (state.user) {
                document.getElementById('cashAmount').textContent = state.user.cash.toLocaleString();
                document.getElementById('userAvatar').textContent = state.user.nickname[0].toUpperCase();
                document.getElementById('streakCount').textContent = state.user.consecutiveLogins + '일';
            }
        }

        function renderCharacters() {
            const grid = document.getElementById('charGrid');
            if (!state.characters.length) { grid.innerHTML = '<p style="color:var(--text2);">캐릭터가 없습니다.</p>'; return; }
            grid.innerHTML = state.characters.map(c => `
                <div class="char-card" onclick="openChat('${c.id}')">
                    <div class="char-card-header" style="background:${c.color}20;"><span>${c.avatar}</span></div>
                    <div class="char-card-body">
                        <div class="char-card-name">${esc(c.name)}${c.isAdult ? '<span class="adult-badge">19</span>' : ''}</div>
                        <div class="char-card-desc">${esc(c.description)}</div>
                        <div class="char-card-creator">@${esc(c.creator)}</div>
                        <div class="char-card-meta"><span>👁 ${fmt(c.views)}</span><span>💬 ${fmt(c.chats)}</span></div>
                    </div>
                </div>
            `).join('');
        }

        async function register() {
            const email = document.getElementById('regEmail').value;
            const nickname = document.getElementById('regNickname').value;
            const password = document.getElementById('regPassword').value;
            const phone = document.getElementById('regPhone').value;
            if (!email || !nickname || !password) { showToast('모든 정보를 입력하세요', 'error'); return; }
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, nickname, password, phone })
                });
                const data = await res.json();
                if (res.ok) {
                    state.sessionId = data.sessionId; state.user = data.user;
                    localStorage.setItem('fusion_session', JSON.stringify({ sessionId: data.sessionId }));
                    if (phone) {
                        await fetch('/api/verify-phone', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.sessionId}` },
                            body: JSON.stringify({ phone })
                        });
                        await fetchUser();
                    }
                    closeModal('registerModal'); updateUI();
                    showToast('가입 완료! 출석체크하세요!', 'success');
                } else { showToast(data.error, 'error'); }
            } catch (e) { showToast('오류 발생', 'error'); }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showToast('정보를 입력하세요', 'error'); return; }
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    state.sessionId = data.sessionId; state.user = data.user;
                    localStorage.setItem('fusion_session', JSON.stringify({ sessionId: data.sessionId }));
                    closeModal('loginModal'); updateUI(); showToast('로그인 성공!', 'success');
                } else { showToast(data.error, 'error'); }
            } catch (e) { showToast('오류 발생', 'error'); }
        }

        function logout() {
            state.user = null; state.sessionId = null;
            localStorage.removeItem('fusion_session'); updateUI();
            showToast('로그아웃 되었습니다', 'success');
        }

        async function checkIn() {
            if (!state.user) { showToast('로그인 필요', 'error'); return; }
            if (!state.user.phoneVerified) { showToast('전화번호 인증 필요', 'error'); return; }
            try {
                const res = await fetch('/api/checkin', { method: 'POST', headers: { 'Authorization': `Bearer ${state.sessionId}` } });
                const data = await res.json();
                if (res.ok) {
                    state.user.cash = data.totalCash; state.user.consecutiveLogins = data.consecutiveLogins;
                    updateUI(); closeModal('checkinModal');
                    showToast(`${data.bonusMessage || ''} +${data.reward}C!`, 'success');
                } else { showToast(data.error, 'error'); }
            } catch (e) { showToast('오류 발생', 'error'); }
        }

        async function purchase(amount) {
            if (!state.user) { showToast('로그인 필요', 'error'); return; }
            try {
                const res = await fetch('/api/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.sessionId}` },
                    body: JSON.stringify({ amount })
                });
                const data = await res.json();
                if (res.ok) {
                    state.user.cash = data.totalCash; updateUI(); closeModal('purchaseModal');
                    showToast(`${data.purchased.toLocaleString()}C 충전!`, 'success');
                } else { showToast(data.error, 'error'); }
            } catch (e) { showToast('오류 발생', 'error'); }
        }

        async function createCharacter() {
            if (!state.user) { showToast('로그인 필요', 'error'); return; }
            const name = document.getElementById('charName').value;
            const prompt = document.getElementById('charPrompt').value;
            if (!name || !prompt) { showToast('이름과 프롬프트 필수', 'error'); return; }
            try {
                const res = await fetch('/api/characters', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.sessionId}` },
                    body: JSON.stringify({
                        name, prompt,
                        description: document.getElementById('charDesc').value,
                        greeting: document.getElementById('charGreeting').value,
                        isAdult: document.getElementById('charIsAdult').checked,
                        avatar: '😊', color: '#8b5cf6'
                    })
                });
                const data = await res.json();
                if (res.ok) { closeModal('createCharModal'); loadCharacters(); showToast('캐릭터 생성!', 'success'); }
                else { showToast(data.error, 'error'); }
            } catch (e) { showToast('오류 발생', 'error'); }
        }

        async function openChat(charId) {
            if (!state.user) { showToast('로그인 필요', 'error'); openModal('loginModal'); return; }
            try {
                const res = await fetch(`/api/characters/${charId}`);
                const char = await res.json();
                if (char.isAdult && !state.user.isAdult) { showToast('성인 인증 필요', 'error'); return; }
                state.currentChar = char; state.messages = [];
                document.getElementById('chatCharAvatar').textContent = char.avatar;
                document.getElementById('chatCharAvatar').style.background = char.color;
                document.getElementById('chatCharName').textContent = char.name;
                document.getElementById('chatCharDesc').textContent = char.description;
                if (char.greeting) state.messages.push({ role: 'assistant', content: char.greeting });
                renderMessages();
                document.getElementById('homePage').style.display = 'none';
                document.getElementById('chatPage').classList.add('active');
            } catch (e) { showToast('캐릭터 로드 실패', 'error'); }
        }

        function goHome() {
            document.getElementById('homePage').style.display = 'block';
            document.getElementById('chatPage').classList.remove('active');
            state.currentChar = null; state.messages = [];
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = state.messages.map(m => `
                <div class="message ${m.role === 'user' ? 'user' : ''}">
                    <div class="message-avatar" style="background:${m.role === 'user' ? 'var(--primary)' : state.currentChar?.color || '#8b5cf6'}">
                        ${m.role === 'user' ? (state.user?.nickname[0] || 'U') : (state.currentChar?.avatar || '🤖')}
                    </div>
                    <div>
                        <div class="message-content">${esc(m.content)}</div>
                        ${m.cost ? `<div class="message-cost">-${m.cost}C</div>` : ''}
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const c = document.getElementById('chatMessages');
            const t = document.createElement('div');
            t.className = 'message'; t.id = 'typingIndicator';
            t.innerHTML = `<div class="message-avatar" style="background:${state.currentChar?.color}">${state.currentChar?.avatar}</div>
                <div class="message-content"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
            c.appendChild(t); c.scrollTop = c.scrollHeight;
        }

        function hideTyping() { document.getElementById('typingIndicator')?.remove(); }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message || !state.currentChar) return;
            const model = document.getElementById('modelSelect').value;
            const cost = MODEL_COSTS[model];
            if (state.user.cash < cost) { showToast(`캐시 부족 (필요: ${cost}C)`, 'error'); return; }

            state.messages.push({ role: 'user', content: message });
            input.value = ''; renderMessages();
            document.getElementById('sendBtn').disabled = true; showTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.sessionId}` },
                    body: JSON.stringify({
                        characterId: state.currentChar.id, message, model,
                        userNote: document.getElementById('userNote').value
                    })
                });
                const data = await res.json(); hideTyping();
                if (res.ok) {
                    state.messages.push({ role: 'assistant', content: data.response, cost: data.cost });
                    state.user.cash = data.remainingCash; updateUI(); renderMessages();
                } else {
                    showToast(data.error, 'error'); state.messages.pop(); renderMessages();
                }
            } catch (e) { hideTyping(); showToast('전송 실패', 'error'); state.messages.pop(); renderMessages(); }
            document.getElementById('sendBtn').disabled = false;
        }

        function handleInputKeydown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        function updateModelCost() { document.getElementById('modelCost').textContent = MODEL_COSTS[document.getElementById('modelSelect').value] + 'C'; }
        function updateNoteCount() { document.getElementById('noteCount').textContent = document.getElementById('userNote').value.length; }
        function updatePromptCount() { document.getElementById('promptCount').textContent = document.getElementById('charPrompt').value.length; }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast ' + type + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>') : ''; }
        function fmt(n) { return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : (n||0).toString(); }
    </script>
</body>
</html>
