<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 캐릭터 챗 – 실사용 웹앱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #0b1220;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #7c3aed;
      --danger: #ef4444;
      --success: #22c55e;
      --shadow: 0 24px 60px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 15% 10%, rgba(124,58,237,0.15), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(56,189,248,0.14), transparent 25%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      padding: 18px;
    }

    @media (max-width: 960px) {
      body { grid-template-columns: 1fr; padding: 12px; }
      .sidebar { position: static; height: auto; }
    }

    .sidebar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      gap: 16px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 12px;
      height: calc(100vh - 24px);
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo {
      display: grid;
      grid-template-columns: 44px 1fr;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #38bdf8, #7c3aed);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #0b1220;
      box-shadow: 0 14px 30px rgba(56,189,248,0.35);
    }
    .logo span { font-weight: 700; letter-spacing: -0.01em; }
    .pill { padding: 8px 10px; border-radius: 10px; background: rgba(56,189,248,0.14); color: var(--accent); border:1px solid rgba(56,189,248,0.35); font-weight: 600; font-size: 12px; }

    .section { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--panel-2); }
    .section h3 { font-size: 14px; margin-bottom: 8px; letter-spacing:-0.01em; }
    .field { display: grid; gap: 6px; margin-bottom: 10px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
    input, textarea, select {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }

    .toggle-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      transition: all .15s ease;
      font-size: 13px;
    }
    .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.12); }

    .main {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      min-height: calc(100vh - 24px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(17,24,39,0.8);
      backdrop-filter: blur(6px);
    }
    .toolbar .meta { color: var(--muted); font-size: 13px; }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn.accent { border-color: var(--accent); color: var(--accent); }

    .chat { padding: 18px; overflow: auto; }
    .bubble {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 12px;
      background: var(--panel-2);
    }
    .bubble.user { border-color: rgba(56,189,248,0.4); }
    .bubble.assistant { border-color: rgba(124,58,237,0.3); }
    .bubble .role { font-weight: 700; color: var(--muted); font-size: 13px; }
    .bubble pre { background: #0b1220; border: 1px solid var(--border); padding: 12px; border-radius: 10px; overflow: auto; }

    .search-results { background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.4); border-radius: 12px; padding: 10px; }
    .search-item { margin-bottom: 8px; }
    .search-item:last-child { margin-bottom: 0; }
    .search-item a { color: var(--accent); }

    .input-area {
      border-top: 1px solid var(--border);
      padding: 14px;
      background: rgba(17,24,39,0.9);
      display: grid;
      gap: 8px;
    }
    .input-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
    .input-box { display: grid; gap: 8px; }
    .input-row { display: grid; grid-template-columns: 1fr 90px; gap: 10px; }
    .send {
      background: var(--accent);
      color: #0b1220;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    .send:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(56,189,248,0.35); }
    .send:disabled { background: #1f2937; color: var(--muted); cursor: not-allowed; box-shadow: none; }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #0b1220;
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: var(--shadow);
      animation: fade 0.3s ease;
      z-index: 50;
    }
    @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none;}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="logo-badge">AI</div>
        <div>
          <span>캐릭터 챗</span><br>
          <small class="pill">크롬 브라우저에서 바로 사용</small>
        </div>
      </div>
      <button class="btn accent" id="newChatBtn">새 대화</button>
    </div>

    <div class="section">
      <h3>API 키</h3>
      <div class="field">
        <div class="label-row"><span>Anthropic API</span><span class="muted">sk-ant-...</span></div>
        <input type="password" id="apiKey" placeholder="API 키 입력" />
      </div>
      <div class="toggle-row">
        <button class="btn" id="saveKey">저장</button>
        <button class="btn" id="clearKey">삭제</button>
      </div>
    </div>

    <div class="section">
      <h3>모델 & 기능</h3>
      <div class="field">
        <div class="label-row"><span>모델 선택</span><span class="muted" id="modelMeta">Claude 4.5 Opus · 80C</span></div>
        <select id="modelSelect"></select>
      </div>
      <div class="toggle-row">
        <div class="chip" data-toggle="thinking">🧠 심층 사고</div>
        <div class="chip" data-toggle="search">🔍 웹 검색</div>
        <div class="chip" data-toggle="research">📚 딥 리서치</div>
      </div>
    </div>

    <div class="section">
      <h3>캐릭터 베이스 프롬프트</h3>
      <div class="field">
        <textarea id="creatorPrompt" placeholder="캐릭터 성격, 말투, 과거사, 세계관 등을 10,000자까지 입력"></textarea>
      </div>
      <div class="label-row"><span>유저 노트</span><span class="muted">1,500자</span></div>
      <textarea id="userNote" placeholder="내 외모, 직업, 캐릭터와의 관계 등"></textarea>
    </div>

    <div class="section">
      <h3>모델 라인업 & 비용</h3>
      <div class="field" id="pricing"></div>
    </div>

    <div class="section">
      <h3>세션 정보</h3>
      <div class="label-row"><span>누적 토큰</span><span id="tokCount">0</span></div>
      <div class="label-row"><span>예상 비용</span><span id="cost">$0.00</span></div>
      <div class="label-row"><span>출력 제한</span><span id="outputLimit">-</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div>
        <div class="meta">현재 모델</div>
        <div id="currentModel">Claude 4.5 Opus</div>
      </div>
      <div class="toolbar-actions">
        <button class="btn" id="exportBtn">내보내기</button>
        <button class="btn" id="clearBtn">대화 초기화</button>
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
      <div class="input-top">
        <span id="status">API 키를 입력해 시작하세요.</span>
        <span id="charCount">0자</span>
      </div>
      <div class="input-box">
        <div class="input-row">
          <textarea id="message" rows="3" placeholder="메시지를 입력하고 Enter로 전송 (Shift+Enter 줄바꿈)"></textarea>
          <button class="send" id="send">보내기</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const models = [
      { id:'claude-opus-4-5-20250514', name:'Claude 4.5 Opus', grade:'Ultra Chat', cost:'80 C', limit:'600자' },
      { id:'claude-sonnet-4-5-20250514', name:'Claude 4.5 Sonnet', grade:'Pro Chat 2.0', cost:'50 C', limit:'600자' },
      { id:'claude-haiku-4-5-20250514', name:'Claude 4.5 Haiku', grade:'Air Chat', cost:'20 C', limit:'600자' }
    ];

    const state = {
      model: models[0].id,
      thinking: false,
      search: false,
      research: false,
      messages: [],
      personaInjected: false,
      totalTokens: 0,
      totalCost: 0
    };

    const els = {
      modelSelect: document.getElementById('modelSelect'),
      modelMeta: document.getElementById('modelMeta'),
      currentModel: document.getElementById('currentModel'),
      chat: document.getElementById('chat'),
      message: document.getElementById('message'),
      send: document.getElementById('send'),
      status: document.getElementById('status'),
      charCount: document.getElementById('charCount'),
      apiKey: document.getElementById('apiKey'),
      saveKey: document.getElementById('saveKey'),
      clearKey: document.getElementById('clearKey'),
      creatorPrompt: document.getElementById('creatorPrompt'),
      userNote: document.getElementById('userNote'),
      pricing: document.getElementById('pricing'),
      tokCount: document.getElementById('tokCount'),
      cost: document.getElementById('cost'),
      outputLimit: document.getElementById('outputLimit'),
      exportBtn: document.getElementById('exportBtn'),
      clearBtn: document.getElementById('clearBtn'),
      newChatBtn: document.getElementById('newChatBtn')
    };

    function init() {
      renderModels();
      renderPricing();
      loadSaved();
      bindEvents();
      updateModelMeta();
      renderEmpty();
    }

    function renderModels() {
      els.modelSelect.innerHTML = models.map(m => `<option value="${m.id}">${m.name} · ${m.grade}</option>`).join('');
      els.modelSelect.value = state.model;
    }

    function renderPricing() {
      els.pricing.innerHTML = models.map(m => `<div style="padding:6px 0;border-bottom:1px solid var(--border);"><div><strong>${m.grade}</strong> – ${m.name}</div><div class="muted">${m.cost} · 출력 ${m.limit}</div></div>`).join('');
    }

    function loadSaved() {
      const key = localStorage.getItem('anthropic_key');
      if (key) els.apiKey.value = key;
      const prompt = localStorage.getItem('creator_prompt');
      if (prompt) els.creatorPrompt.value = prompt;
      const note = localStorage.getItem('user_note');
      if (note) els.userNote.value = note;
    }

    function bindEvents() {
      els.modelSelect.addEventListener('change', () => {
        state.model = els.modelSelect.value;
        updateModelMeta();
      });

      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          chip.classList.toggle('active');
          const key = chip.dataset.toggle;
          state[key] = chip.classList.contains('active');
          if (key === 'research' && state.research) {
            state.search = true;
            document.querySelector('[data-toggle="search"]').classList.add('active');
          }
        });
      });

      els.saveKey.onclick = () => { localStorage.setItem('anthropic_key', els.apiKey.value.trim()); toast('API 키 저장 완료'); };
      els.clearKey.onclick = () => { localStorage.removeItem('anthropic_key'); els.apiKey.value=''; toast('API 키 삭제'); };
      els.creatorPrompt.oninput = () => localStorage.setItem('creator_prompt', els.creatorPrompt.value);
      els.userNote.oninput = () => localStorage.setItem('user_note', els.userNote.value);

      els.message.addEventListener('input', () => {
        els.charCount.textContent = `${els.message.value.length}자`;
        els.send.disabled = !els.message.value.trim();
      });
      els.message.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!els.send.disabled) sendMessage();
        }
      });

      els.send.onclick = sendMessage;
      els.exportBtn.onclick = exportChat;
      els.clearBtn.onclick = () => { state.messages = []; state.personaInjected=false; renderEmpty(); };
      els.newChatBtn.onclick = () => { state.messages = []; state.personaInjected=false; renderEmpty(); toast('새 대화 시작'); };
    }

    function updateModelMeta() {
      const m = models.find(x => x.id === state.model) || models[0];
      els.modelMeta.textContent = `${m.name} · ${m.cost}`;
      els.currentModel.textContent = `${m.grade} · ${m.name}`;
      els.outputLimit.textContent = m.limit;
    }

    function renderEmpty() {
      els.chat.innerHTML = `<div class="bubble" style="text-align:center; color: var(--muted);">
        📡 캐릭터 프롬프트와 메시지를 입력하면 대화를 시작합니다.
        <div style="margin-top:6px; font-size:12px;">심층 사고 / 웹 검색 / 딥 리서치 토글을 사이드바에서 켜세요.</div>
      </div>`;
      els.status.textContent = 'API 키를 입력해 시작하세요.';
    }

    function addMessage(role, content, thinking=null, searchResults=null) {
      const div = document.createElement('div');
      div.className = `bubble ${role}`;
      div.innerHTML = `<div class="role">${role === 'user' ? '사용자' : 'AI'}</div>`;
      if (searchResults) {
        const box = document.createElement('div');
        box.className = 'search-results';
        box.innerHTML = `<strong>웹 검색 결과</strong>` + searchResults.map(r => `<div class="search-item"><a href="${r.url}" target="_blank">${escapeHtml(r.title)}</a><div class="muted" style="font-size:12px;">${r.url}</div></div>`).join('');
        div.appendChild(box);
      }
      if (thinking) {
        const pre = document.createElement('pre');
        pre.textContent = thinking;
        pre.style.whiteSpace = 'pre-wrap';
        div.appendChild(pre);
      }
      const body = document.createElement('div');
      body.innerHTML = formatMd(content);
      div.appendChild(body);
      els.chat.appendChild(div);
      els.chat.scrollTop = els.chat.scrollHeight;
    }

    function formatMd(text) {
      return text.replace(/\n/g, '<br>');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function sendMessage() {
      const apiKey = els.apiKey.value.trim();
      if (!apiKey) { toast('API 키를 입력하세요', 'error'); return; }
      const content = els.message.value.trim();
      if (!content) return;

      els.send.disabled = true;
      els.status.textContent = '응답 생성 중...';

      // inject persona once
      if (!state.personaInjected && (els.creatorPrompt.value || els.userNote.value)) {
        state.messages.push({ role:'user', content: ` [캐릭터 베이스 프롬프트]\n${els.creatorPrompt.value}\n\n[유저 노트]\n${els.userNote.value} ` });
        state.personaInjected = true;
      }

      state.messages.push({ role:'user', content });
      addMessage('user', content);
      els.message.value = '';
      els.charCount.textContent = '0자';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apiKey,
            messages: state.messages,
            model: state.model,
            thinking: state.thinking,
            search: state.search,
            research: state.research
          })
        });
        if (!res.ok) throw new Error('API 오류');
        const data = await res.json();

        let answer = '';
        let thinking = null;
        if (data.content) {
          data.content.forEach(block => {
            if (block.type === 'thinking') thinking = block.thinking;
            if (block.type === 'text') answer += block.text;
          });
        }

        const searchResults = data.searchResults || null;
        addMessage('assistant', answer || '응답이 비어 있습니다.', thinking, searchResults);
        state.messages.push({ role:'assistant', content: answer, thinking });

        if (data.usage) {
          const priceMap = {
            'claude-opus-4-5-20250514': { input: 5, output: 25 },
            'claude-sonnet-4-5-20250514': { input: 3, output: 15 },
            'claude-haiku-4-5-20250514': { input: 1, output: 5 }
          };
          const p = priceMap[state.model] || priceMap['claude-opus-4-5-20250514'];
          state.totalTokens += (data.usage.input_tokens || 0) + (data.usage.output_tokens || 0);
          state.totalCost += (data.usage.input_tokens/1_000_000)*p.input + (data.usage.output_tokens/1_000_000)*p.output;
          els.tokCount.textContent = formatTokens(state.totalTokens);
          els.cost.textContent = `$${state.totalCost.toFixed(2)}`;
        }

        els.status.textContent = '완료';
      } catch (e) {
        addMessage('assistant', `오류: ${e.message}`);
        toast(e.message, 'error');
      } finally {
        els.send.disabled = false;
      }
    }

    function formatTokens(n) {
      if (n >= 1_000_000) return (n/1_000_000).toFixed(2)+'M';
      if (n >= 1_000) return (n/1_000).toFixed(1)+'K';
      return n.toString();
    }

    function exportChat() {
      if (!state.messages.length) { toast('내보낼 대화가 없습니다', 'error'); return; }
      let md = '# 캐릭터 챗 대화\n\n';
      state.messages.forEach(m => { md += `## ${m.role === 'user' ? '사용자' : 'AI'}\n\n${m.content}\n\n---\n`; });
      const blob = new Blob([md], { type:'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chat.md';
      a.click();
    }

    function toast(msg, type='info') {
      const div = document.createElement('div');
      div.className = 'toast';
      div.style.borderColor = type==='error'? 'rgba(239,68,68,0.6)' : varAccentBorder();
      div.textContent = msg;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 2200);
    }
    function varAccentBorder() { return 'rgba(56,189,248,0.4)'; }

    init();
  </script>
</body>
</html>
